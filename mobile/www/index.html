<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Raven Phone</title>
    <style>
      html, body { margin: 0; height: 100%; background: #050505; color: #fff; font: 16px/1.4 system-ui, sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; padding: 2rem; }
      h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1rem; max-width: 28rem; }
      button { border: 2px solid #fff; background: #111; color: #fff; font-weight: 700; padding: 0.6rem 1rem; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Raven Phone is offline</h1>
        <p>Check the internet connection, then try again.</p>
        <button type="button" onclick="location.href='https://ravenpbx.com/app'">Try again</button>
      </div>
    </main>
  </body>
</html>
