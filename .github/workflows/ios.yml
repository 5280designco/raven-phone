name: iOS app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Sync
        working-directory: mobile
        run: npx cap sync ios
      - name: Compile
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP=$(find build -path '*Release-iphoneos/App.app' -type d | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r RavenPhone-1.4.0-unsigned.ipa Payload
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-ios
          name: Raven Phone 1.4.0 for iOS
          body: Unsigned Capacitor build of the phone app. It loads https://ravenpbx.com/app. An iPhone will not install this until it is signed with an Apple developer certificate. Open mobile/ios/App in Xcode, select your team, and archive it for the App Store.
          files: mobile/ios/App/RavenPhone-1.4.0-unsigned.ipa
          overwrite_files: true
