name: Mac disk image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build disk images
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm install dmg-license --no-audit --no-fund
          npx electron-builder --mac dmg --arm64 --x64
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Raven Phone 1.3.0 for Mac
          body: Open the disk image and drag Raven Phone to Applications. Apple silicon is arm64. Intel is x64. The first time, right-click Raven Phone and choose Open.
          files: desktop/dist/*.dmg
          overwrite_files: true
